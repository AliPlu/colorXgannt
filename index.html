  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  document.documentElement.style.setProperty("--n", N);
  $("#grid").style.minWidth = `calc(var(--label-w) + ${N} * 46px)`;
  $("#t").textContent = PROGETTO.titolo;
  $("#st").textContent = PROGETTO.sottotitolo;
  $("#bd").textContent = PROGETTO.bando;

  const monthDate = (m) => new Date(PROGETTO.avvio.anno, PROGETTO.avvio.mese - 1 + m - 1, 1);
  const short = (m) => { const d = monthDate(m); return `${MESI[d.getMonth()]} ${d.getFullYear()}`; };
  const long = (m) => { const d = monthDate(m); return `${MESI_LUNGHI[d.getMonth()]} ${d.getFullYear()}`; };
  const range = ([a, b]) => a === b ? `M${a} · ${long(a)}` : `M${a}–M${b} · ${short(a)} – ${short(b)}`;

  // legends
  WORK_PACKAGES.forEach((wp) => {
    const c = el("span", "chip static", `<i></i>${wp.id}`);
    c.style.setProperty("--c", wp.colore);
    $("#wpLegend").appendChild(c);
  });
  let activeDep = null;
  Object.entries(DIPARTIMENTI).forEach(([k, d]) => {
    const b = el("button", "chip", `<i></i>${esc(d.nome)}`);
    b.style.setProperty("--c", d.colore);
    b.setAttribute("aria-pressed", "false");
    b.dataset.dep = k;
    b.addEventListener("click", () => {
      activeDep = activeDep === k ? null : k;
      document.querySelectorAll("#depFilter .chip").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.dep === activeDep)));
      applyFilter();
    });
    $("#depFilter").appendChild(b);
  });

  const grid = $("#grid");

  // header
  const head = el("div", "head");
  const yRow = el("div", "row");
  yRow.appendChild(el("div", "label", ""));
  let m = 1;
  while (m <= N) {
    const y = monthDate(m).getFullYear();
    let e = m;
    while (e + 1 <= N && monthDate(e + 1).getFullYear() === y) e++;
    const yc = el("div", "yr", `<span>${y}</span>`);
    yc.style.gridColumn = `${m + 1} / ${e + 2}`;
    yRow.appendChild(yc);
    m = e + 1;
  }
  const mRow = el("div", "row head-sep");
  mRow.appendChild(el("div", "label", "Mese di progetto"));
  for (let i = 1; i <= N; i++) {
    const d = monthDate(i);
    const mc = el("div", "mo", `<b>M${i}</b>${MESI[d.getMonth()]}`);
    mc.style.gridColumn = i + 1;
    mRow.appendChild(mc);
  }
  head.append(yRow, mRow);
  grid.appendChild(head);

  const chevron = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const addBar = (row, [a, b], color, onClick, labelText) => {
    const bar = el("button", "bar");
    bar.style.gridColumn = `${a + 1} / ${b + 2}`;
    bar.style.setProperty("--c", color);
    bar.setAttribute("aria-label", labelText);
    bar.addEventListener("click", onClick);
    row.appendChild(bar);
  };

  WORK_PACKAGES.forEach((wp) => {
    const wpRow = el("div", "row wp");
    wpRow.style.setProperty("--c", wp.colore);
    const lab = el("div", "label");
    const tg = el("button", "toggle", chevron);
    tg.setAttribute("aria-label", `Mostra o nascondi i task di ${wp.id}`);
    tg.setAttribute("aria-expanded", "true");
    const op = el("button", "open", `<span class="code">${wp.id}</span><span class="name">${esc(wp.titolo)}</span>`);
    op.addEventListener("click", () => openWP(wp));
    lab.append(tg, op);
    wpRow.appendChild(lab);
    addBar(wpRow, wp.mesi, wp.colore, () => openWP(wp), `${wp.id}: ${wp.titolo}`);
    grid.appendChild(wpRow);

    const taskRows = [];
    wp.tasks.forEach((t) => {
      const r = el("div", "row task");
      r.dataset.dep = t.dip.join(" ");
      const l = el("div", "label");
      const o = el("button", "open", `<span class="code">${t.id}</span><span class="name">${esc(t.titolo)}</span>`);
      o.addEventListener("click", () => openTask(t, wp));
      l.appendChild(o);
      r.appendChild(l);
      t.periodi.forEach((p) => addBar(r, p, wp.colore, () => openTask(t, wp), `${t.id}: ${t.titolo}, ${range(p)}`));
      t.deliverable.forEach((d) => {
        const dv = el("button", "deliv", d.id.replace("D", ""));
        dv.style.gridColumn = d.mese + 1;
        dv.style.setProperty("--c", wp.colore);
        dv.title = `${d.id} · ${d.titolo} (M${d.mese})`;
        dv.setAttribute("aria-label", `Deliverable ${d.id}: ${d.titolo}`);
        dv.addEventListener("click", (ev) => { ev.stopPropagation(); openTask(t, wp); });
        r.appendChild(dv);
      });
      grid.appendChild(r);
      taskRows.push(r);
    });

    tg.addEventListener("click", () => {
      const collapsed = wpRow.classList.toggle("collapsed");
      tg.setAttribute("aria-expanded", String(!collapsed));
      taskRows.forEach((r) => (r.hidden = collapsed));
    });
  });

  function applyFilter() {
    document.querySelectorAll(".row.task").forEach((r) => {
      r.classList.toggle("dim", !!activeDep && !r.dataset.dep.split(" ").includes(activeDep));
    });
  }

  // linee di separazione tra gli anni
  for (let i = 2; i <= N; i++) {
    if (monthDate(i).getMonth() === 0) {
      const yl = el("div", "year-line");
      yl.style.left = `calc(var(--label-w) + (100% - var(--label-w)) * ${(i - 1) / N})`;
      grid.appendChild(yl);
    }
  }

  // today marker
  const now = new Date();
  const idx = (now.getFullYear() - PROGETTO.avvio.anno) * 12 + now.getMonth() - (PROGETTO.avvio.mese - 1);
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const pos = idx + (now.getDate() - 1) / dim;
  if (pos >= 0 && pos <= N) {
    const t = el("div", "today", "<span>oggi</span>");
    t.style.left = `calc(var(--label-w) + (100% - var(--label-w)) * ${pos / N})`;
    grid.appendChild(t);
  }

  // panel
  const panel = $("#panel"), scrim = $("#scrim"), body = $("#pBody");
  let lastFocus = null;
  const depChips = (keys) => keys.map((k) => {
    const d = DIPARTIMENTI[k];
    return d ? `<span class="chip static" style="--c:${d.colore}"><i></i>${esc(d.nome)}</span>` : "";
  }).join("");
  const startWarn = (periods) => PROGETTO.avvioDaConfermare && periods.some((p) => p[0] === 1)
    ? `<div class="warn"><strong>Da ricalcolare.</strong> Questa attività parte dal mese di avvio, ancora provvisorio.</div>` : "";

  function show(html, color) {
    body.innerHTML = html;
    body.style.setProperty("--c", color);
    lastFocus = document.activeElement;
    panel.classList.add("on"); scrim.classList.add("on");
    $("#close").focus();
  }
  function hide() {
    panel.classList.remove("on"); scrim.classList.remove("on");
    if (lastFocus) lastFocus.focus();
  }
  $("#close").addEventListener("click", hide);
  scrim.addEventListener("click", hide);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && panel.classList.contains("on")) hide(); });

  function openTask(t, wp) {
    const deliv = t.deliverable.length
      ? `<h3>Deliverable</h3><ul>${t.deliverable.map((d) => `<li><span class="deliv" style="--c:${wp.colore}">${d.id.replace("D", "")}</span><div><strong>${d.id}</strong> · M${d.mese}, ${long(d.mese)}<br>${esc(d.titolo)}</div></li>`).join("")}</ul>` : "";
    show(`
      <span class="tag">${wp.id} · ${t.id}</span>
      <h2 id="pTitle">${esc(t.titolo)}</h2>
      <p class="when">${t.periodi.map(range).join("<br>")}</p>
      <h3>Descrizione</h3><p>${esc(t.descrizione)}</p>
      <h3>Dipartimenti coinvolti</h3><div class="chips">${depChips(t.dip)}</div>
      ${deliv}
      ${startWarn(t.periodi)}
    `, wp.colore);
  }

  function openWP(wp) {
    const allDeps = [...new Set(wp.tasks.flatMap((t) => t.dip))];
    show(`
      <span class="tag">${wp.id}</span>
      <h2 id="pTitle">${esc(wp.titolo)}</h2>
      <p class="when">${range(wp.mesi)}</p>
      <h3>Obiettivo</h3><p>${esc(wp.obiettivo)}</p>
      <h3>Ambito</h3><p class="meta">${esc(wp.ambito)}</p>
      <h3>Destinatari</h3><p class="meta">${esc(wp.destinatari)}</p>
      <h3>Dipartimenti coinvolti</h3><div class="chips">${depChips(allDeps)}</div>
      <h3>Task</h3><ul>${wp.tasks.map((t) => `<li><strong>${t.id}</strong><div>${esc(t.titolo)}<br><span class="meta">${t.periodi.map((p) => `M${p[0]}–M${p[1]}`).join(", ")}</span></div></li>`).join("")}</ul>
      ${startWarn([wp.mesi])}
    `, wp.colore);
  }
})();
</script>
</body>
</html>
